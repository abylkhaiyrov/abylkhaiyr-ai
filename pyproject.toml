[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "numpy",
    "tokenizers",
    "datasets",
    "pyarrow",
    "safetensors",
    "pydantic>=2",
    "tensorboard",
    "fastapi",
    "uvicorn",
    "websockets>=12,<16",
    "psutil",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "sympy",
    "pyyaml",
    "langdetect",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "mypy", "httpx", "types-PyYAML", "types-psutil"]

[project.scripts]
llm = "llm.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "llm.optimization.adamw"
disable_error_code = ["override"]
