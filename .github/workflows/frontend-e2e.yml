name: frontend-e2e

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend-e2e.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-e2e.yml"]

jobs:
  e2e:
    name: ${{ matrix.os }} / ${{ matrix.project }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, project: chromium, install: chromium }
          - { os: ubuntu-latest, project: firefox, install: firefox }
          - { os: ubuntu-latest, project: mobile-375, install: chromium }
          - { os: ubuntu-latest, project: hidpi-200, install: chromium }
          - { os: ubuntu-latest, project: uhd-4k, install: chromium }
          - { os: windows-latest, project: chromium, install: chromium }
          - { os: windows-latest, project: firefox, install: firefox }
          - { os: windows-latest, project: edge, install: msedge }
          - { os: macos-latest, project: chromium, install: chromium }
          - { os: macos-latest, project: webkit, install: webkit }
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.install }}
      - run: npm run lint && npm run typecheck && npm test
        if: matrix.project == 'chromium' && matrix.os == 'ubuntu-latest'
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.os }}-${{ matrix.project }}
          path: |
            frontend/test-results
            frontend/playwright-report
