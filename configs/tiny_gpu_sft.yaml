name: tiny_gpu_sft
model:
  vocab_size: 8192
  hidden_size: 384
  num_hidden_layers: 8
  num_attention_heads: 6
  num_key_value_heads: 2
  intermediate_size: 1024
  max_position_embeddings: 512
tokenizer:
  vocab_size: 8192
  path: data/tokenizer
train:
  stage: sft
  data_dir: data/gpu_chat
  init_from: checkpoints/tiny_gpu/best
  restore_optimizer: false
  output_dir: experiments/tiny_gpu_sft
  checkpoint_dir: checkpoints/tiny_gpu_sft
  device: cuda
  precision: bf16
  max_steps: 1600
  micro_batch_size: 16
  gradient_accumulation_steps: 2
  sequence_length: 511
  num_threads: 4
  bucket_window: 256
  eval_interval: 100
  eval_batches: 30
  log_interval: 10
  checkpoint_interval: 100
  keep_checkpoints: 3
  early_stopping_patience: 6
  mixture:
    dialog: 0.25
    identity: 0.15
    skills: 0.23
    reading_ru: 0.12
    reading_kk: 0.06
    reading_en: 0.05
    chat_en: 0.06
    word_math: 0.04
    code: 0.04
  optimizer:
    learning_rate: 0.0003
    warmup_steps: 60
    weight_decay: 0.05
    foreach: true
