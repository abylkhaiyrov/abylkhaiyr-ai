name: medium
model:
  vocab_size: 8192
  hidden_size: 1024
  num_hidden_layers: 28
  num_attention_heads: 16
  num_key_value_heads: 4
  intermediate_size: 2752
  max_position_embeddings: 1024
tokenizer:
  vocab_size: 8192
  path: data/tokenizer
train:
  stage: pretrain
  data_dir: data/v2
  output_dir: experiments/medium
  checkpoint_dir: checkpoints/medium
  device: mps
  precision: fp32
  max_steps: 20000
  micro_batch_size: 2
  gradient_accumulation_steps: 32
  sequence_length: 512
  eval_interval: 500
  eval_batches: 50
  log_interval: 50
  checkpoint_interval: 1000
  keep_checkpoints: 3
  protected_steps:
  - 5000
  - 10000
  - 20000
  checkpoint_alias: medium
  activation_checkpointing: true
  mixture:
    ru: 1.0
    kk: 1.0
    en: 1.0
    math: 0.5
    code: 0.5
  dataset_version: v2
  optimizer:
    learning_rate: 0.0003
    warmup_steps: 500
    weight_decay: 0.1
    min_lr_ratio: 0.1
    max_grad_norm: 1.0
