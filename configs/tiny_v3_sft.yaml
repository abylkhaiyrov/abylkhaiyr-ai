name: tiny_v3_sft
model:
  vocab_size: 8192
  hidden_size: 384
  num_hidden_layers: 8
  num_attention_heads: 6
  num_key_value_heads: 2
  intermediate_size: 1024
  max_position_embeddings: 512
tokenizer:
  vocab_size: 8192
  path: data/tokenizer
train:
  stage: sft
  data_dir: data/v3
  init_from: checkpoints/tiny_v2/tiny_best
  restore_optimizer: false
  output_dir: experiments/tiny_v3_sft
  checkpoint_dir: checkpoints/tiny_v3_sft
  device: mps
  precision: fp32
  max_steps: 2000
  micro_batch_size: 8
  gradient_accumulation_steps: 4
  sequence_length: 511
  eval_interval: 200
  eval_batches: 30
  log_interval: 25
  checkpoint_interval: 500
  keep_checkpoints: 3
  protected_steps: [500, 1000, 2000]
  checkpoint_alias: tiny_v3_sft
  mixture: {chat: 0.26, skills: 0.22, dialog: 0.07, identity: 0.07, math: 0.08, word_math: 0.12, code: 0.10}
  dataset_version: v3
  optimizer: {learning_rate: 0.0002, warmup_steps: 100, weight_decay: 0.1, min_lr_ratio: 0.1, max_grad_norm: 1.0}
