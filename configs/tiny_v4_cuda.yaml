name: tiny_v4_cuda
model:
  vocab_size: 16384
  hidden_size: 384
  num_hidden_layers: 8
  num_attention_heads: 6
  num_key_value_heads: 2
  intermediate_size: 1024
  max_position_embeddings: 512
tokenizer:
  vocab_size: 16384
  path: experiments/v4/bpe-16384
train:
  stage: pretrain
  data_dir: data/v4/scaling_16384
  output_dir: experiments/v4/tiny_cuda
  checkpoint_dir: checkpoints/tiny_v4_cuda
  device: cuda
  precision: bf16
  micro_batch_size: 4
  gradient_accumulation_steps: 8
  sequence_length: 512
  fast_causal: true
  max_steps: 6104
  eval_interval: 61
  eval_batches: 12
  checkpoint_interval: 61
  keep_checkpoints: 3
  protected_steps: [305, 1221, 3052, 6104]
  dynamic_batch_size: false
  mixture: {en: 1.0, kk: 1.0, ru: 1.0}
  dataset_version: v4-expanded-bpe16384
  optimizer: {learning_rate: 0.0004, warmup_steps: 100, foreach: true}
