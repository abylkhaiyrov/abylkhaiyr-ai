name: tiny_sweep
model:
  vocab_size: 8192
  hidden_size: 384
  num_hidden_layers: 8
  num_attention_heads: 6
  num_key_value_heads: 2
  intermediate_size: 1024
  max_position_embeddings: 512
tokenizer:
  vocab_size: 8192
  path: data/tokenizer
train:
  stage: pretrain
  init_from: checkpoints/tiny_session
  precision: fp32
  device: mps
  micro_batch_size: 8
  gradient_accumulation_steps: 8
  sequence_length: 512
  optimizer: {learning_rate: 0.001, warmup_steps: 40, weight_decay: 0.1}
