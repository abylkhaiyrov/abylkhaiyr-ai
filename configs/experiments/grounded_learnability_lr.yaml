name: grounded_learnability_lr
base_config: configs/tiny_v31_sft_stage11.yaml
initial_checkpoint: checkpoints/tiny_v31_sft_stage11/step-00000120
job_template: '{arm}-{seed}'
seeds:
- 1
token_budget: 1962240
tokens_per_step: 16352
output_root: experiments/grounded_learnability_lr
checkpoint_root: checkpoints/grounded_learnability_lr
state_file: campaign.json
train:
  restore_optimizer: false
  checkpoint_alias: null
  protected_steps:
  - 120
  keep_checkpoints: 2
  eval_interval: 40
  checkpoint_interval: 40
  eval_batches: 20
  min_free_disk_gb: 20.0
  sft_replay_dir: null
  sft_replay_fraction: 0.0
optimizer:
  learning_rate: 4.0e-05
  warmup_steps: 12
  min_lr_ratio: 0.1
arms:
  lr1e-4:
    data_dir: data/grounded/reading_b
    mixture:
      reading_en: 1.0
      reading_ru: 1.0
      reading_kk: 1.0
    optimizer:
      learning_rate: 0.0001
  lr2e-4:
    data_dir: data/grounded/reading_b
    mixture:
      reading_en: 1.0
      reading_ru: 1.0
      reading_kk: 1.0
    optimizer:
      learning_rate: 0.0002
frozen_inputs:
  initial_weights: checkpoints/tiny_v31_sft_stage11/step-00000120/model.safetensors
  initial_metadata: checkpoints/tiny_v31_sft_stage11/step-00000120/meta.json
  tokenizer: data/tokenizer/tokenizer.json
  grounded_dev: data/grounded/dev.jsonl
  grounded_trained: data/grounded/trained.jsonl
  grounded_train_en: data/grounded/reading_b/sft_groups/train.reading_en.jsonl
  grounded_train_ru: data/grounded/reading_b/sft_groups/train.reading_ru.jsonl
  grounded_train_kk: data/grounded/reading_b/sft_groups/train.reading_kk.jsonl
calibration_file: experiments/stage18/profile.json
resources:
  ram_margin_gib: 0.5
  disk_reserve_gib: 20.0
  disk_per_job_gib: 0.6
  disk_slack_gib: 0.5
limits:
  active_seconds: 2400
  absolute_seconds: 7200
  max_resource_wait_seconds: 600
  max_gap_seconds: 30
evaluation:
  baseline: checkpoints/tiny_v31_sft_stage11/step-00000120
  device: mps
  tokenizer: data/tokenizer
  repetitions: 10000
  suites:
  - name: grounded
    options:
      file: data/grounded/dev.jsonl
      training:
      - data/grounded/reading_b/sft_groups/train.reading_*.jsonl
  - name: grounded
    label: trained
    options:
      file: data/grounded/trained.jsonl
