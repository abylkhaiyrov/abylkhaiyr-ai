base_config: configs/capacity_tiny_sft.yaml
initial_checkpoint: checkpoints/stage17/tiny-seed-1/step-00000305
job_template: '{arm}-{seed}'
tokens_per_step: 16352
state_file: campaign.json
train:
  restore_optimizer: false
  checkpoint_alias: null
  protected_steps:
  - 120
  keep_checkpoints: 2
  eval_interval: 40
  checkpoint_interval: 40
  eval_batches: 20
  min_free_disk_gb: 20.0
  micro_batch_size: 4
  gradient_accumulation_steps: 8
optimizer:
  learning_rate: 0.0001
  warmup_steps: 12
  min_lr_ratio: 0.1
calibration_file: configs/experiments/capacity_calibration.json
resources:
  ram_margin_gib: 0.5
  disk_reserve_gib: 20.0
  disk_per_job_gib: 0.6
  disk_slack_gib: 0.5
name: capacity_tiny
seeds:
- 1
token_budget: 2616320
output_root: experiments/capacity_tiny
checkpoint_root: checkpoints/capacity_tiny
arms:
  lr0.0001:
    data_dir: data/grounded/reading_m25
    mixture: &id001
      reading_en: 0.15
      reading_ru: 0.175
      reading_kk: 0.175
      chat_en: 0.05814
      chat_ru: 0.034884
      chat_kk: 0.005814
      chat_other: 0.017442
      skills: 0.116279
      dialog: 0.040698
      identity: 0.040698
      math: 0.046512
      word_math: 0.05814
      code: 0.081395
    optimizer:
      learning_rate: 0.0001
  lr0.0003:
    data_dir: data/grounded/reading_m25
    mixture: *id001
    optimizer:
      learning_rate: 0.0003
  lr0.001:
    data_dir: data/grounded/reading_m25
    mixture: *id001
    optimizer:
      learning_rate: 0.001
frozen_inputs:
  initial_weights: checkpoints/stage17/tiny-seed-1/step-00000305/model.safetensors
  initial_metadata: checkpoints/stage17/tiny-seed-1/step-00000305/meta.json
  tokenizer: data/tokenizer/tokenizer.json
  registration: docs/capacity_preregistration.md
  grounded_dev: data/grounded/dev.jsonl
  context_probes_dev: data/diagnostics_dev/probes.jsonl
  block_b_en: data/grounded/reading_b/sft_groups/train.reading_en.jsonl
  block_b_ru: data/grounded/reading_b/sft_groups/train.reading_ru.jsonl
  block_b_kk: data/grounded/reading_b/sft_groups/train.reading_kk.jsonl
  block_m25_en: data/grounded/reading_m25/sft_groups/train.reading_en.jsonl
  block_m25_ru: data/grounded/reading_m25/sft_groups/train.reading_ru.jsonl
  block_m25_kk: data/grounded/reading_m25/sft_groups/train.reading_kk.jsonl
  trained_cases: data/grounded/trained.jsonl
limits:
  active_seconds: 1200
  absolute_seconds: 14400
  max_resource_wait_seconds: 600
  max_gap_seconds: 30
evaluation:
  baseline: checkpoints/stage17/tiny-seed-1/step-00000305
  device: mps
  tokenizer: data/tokenizer
  repetitions: 10000
  cache: experiments/evaluation_cache
  suites:
  - name: perplexity
    options:
      sets:
        v2_validation:
        - data/v2/tokens
        - validation
        - 200
  - name: grounded
    options:
      file: data/grounded/dev.jsonl
      training:
      - data/grounded/reading_m25/sft_groups/train.reading_*.jsonl
  - name: probes
    options:
      file: data/diagnostics_dev/probes.jsonl
      unigram: data/v4_expanded/tokens/train.bin
  - name: grounded
    label: pairs
    options:
      file: data/grounded/pairs.jsonl
      prefix: pairs.
      training:
      - data/grounded/reading_m25/sft_groups/train.reading_*.jsonl
  - name: grounded
    label: trained
    options:
      file: data/grounded/trained.jsonl
  gates: []
