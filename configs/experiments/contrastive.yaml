name: contrastive
base_config: configs/tiny_v31_sft_stage11.yaml
initial_checkpoint: checkpoints/tiny_v2/tiny_best
job_template: '{arm}-{seed}'
seeds:
- 1
token_budget: 1600000
tokens_per_step: 2000
output_root: experiments/contrastive
checkpoint_root: checkpoints/contrastive
state_file: campaign.json
order:
- C0-1
- C1-1
stopping:
  max_steps: 800
train:
  stage: sft
  data_dir: data/verified_v1
  dataset_version: verified-v1
  restore_optimizer: false
  mixture: {}
  sft_replay_dir: null
  sft_replay_fraction: 0.0
  pack_sequences: false
  checkpoint_alias: null
  micro_batch_size: 8
  gradient_accumulation_steps: 4
  sequence_length: 511
  eval_interval: 200
  eval_batches: 40
  checkpoint_interval: 400
  keep_checkpoints: 2
  protected_steps:
  - 800
  dynamic_batch_size: false
arms:
  C0:
    train:
      contrastive:
        weight: 0.0
  C1:
    train:
      contrastive:
        weight: 0.5
        beta: 1.0
        margin: 0.0
frozen_inputs:
  initial_weights: checkpoints/tiny_v2/tiny_best/model.safetensors
  benchmark: configs/acceptance/benchmark_v1.json
  rubric: docs/acceptance_benchmark.md
  design: docs/contrastive_design.md
  registration: docs/contrastive_registration.md
  pairs_train: data/verified_v1/preference/train.jsonl
  pairs_validation: data/verified_v1/preference/validation.jsonl
resources:
  ram_margin_gib: 0.5
  disk_reserve_gib: 20.0
  disk_per_job_gib: 0.6
  disk_slack_gib: 0.5
limits:
  active_seconds: 3600
  absolute_seconds: 10800
  max_resource_wait_seconds: 600
  max_gap_seconds: 30
evaluation:
  baseline: checkpoints/tiny_v31_sft_stage11/step-00000120
  device: mps
  tokenizer: data/tokenizer
  repetitions: 1000
  suites:
  - name: perplexity
    options:
      sets:
        v2_validation:
        - data/v2/tokens
        - validation
        - 200
        v2_test:
        - data/v2/tokens
        - test
        - 200
