name: copy_scale
base_config: configs/capacity_tiny_sft.yaml
initial_checkpoint: checkpoints/stage17/tiny-seed-1/step-00000305
job_template: '{arm}-{seed}'
seeds:
- 1
token_budget: 9168000
tokens_per_step: 3056
output_root: experiments/copy_scale
checkpoint_root: checkpoints/copy_scale
state_file: campaign.json
train:
  restore_optimizer: false
  mixture: {}
  sft_replay_dir: null
  sft_replay_fraction: 0.0
  pack_sequences: false
  checkpoint_alias: null
  micro_batch_size: 16
  gradient_accumulation_steps: 1
  sequence_length: 191
  eval_interval: 150
  checkpoint_interval: 150
  eval_batches: 20
  log_interval: 50
  protected_steps:
  - 300
  - 750
  - 1500
  - 3000
  keep_checkpoints: 2
  dataset_version: copy
  min_free_disk_gb: 20.0
optimizer:
  learning_rate: 0.001
  warmup_steps: 12
  min_lr_ratio: 1.0
arms:
  A:
    data_dir: data/copy/copy648
  B:
    data_dir: data/copy_scale/B
frozen_inputs:
  initial_weights: checkpoints/stage17/tiny-seed-1/step-00000305/model.safetensors
  initial_metadata: checkpoints/stage17/tiny-seed-1/step-00000305/meta.json
  tokenizer: data/tokenizer/tokenizer.json
  registration: docs/copy_scale_registration.md
  ladder: data/grounded/copy_ladder.jsonl
  train_A: data/copy/copy648/sft/train.jsonl
  train_B: data/copy_scale/B/sft/train.jsonl
  dev: data/copy_scale/dev.jsonl
  holdout: data/copy_scale/holdout.jsonl
  trained_A: data/copy/trained.jsonl
  permuted_A: data/copy/permuted.jsonl
  trained_B: data/copy_scale/trained_B.jsonl
  permuted_B: data/copy_scale/permuted_B.jsonl
  manifest: data/copy_scale/manifest.json
calibration_file: configs/experiments/capacity_calibration.json
resources:
  ram_margin_gib: 0.5
  disk_reserve_gib: 20.0
  disk_per_job_gib: 0.6
  disk_slack_gib: 0.5
limits:
  active_seconds: 1800
  absolute_seconds: 14400
  max_resource_wait_seconds: 600
  max_gap_seconds: 30
evaluation:
  baseline: checkpoints/stage17/tiny-seed-1/step-00000305
  device: mps
  tokenizer: data/tokenizer
  repetitions: 10000
  cache: experiments/evaluation_cache
  gates: []
  suites:
  - name: copy
    label: dev
    options:
      file: data/copy_scale/dev.jsonl
      prefix: dev.
      formats: &id001
      - chat
      - plain
      - chat_space
      framed: true
  - name: copy
    label: holdout
    options:
      file: data/copy_scale/holdout.jsonl
      prefix: holdout.
      formats: *id001
      framed: true
  - name: copy
    label: ladder
    options:
      file: data/grounded/copy_ladder.jsonl
      prefix: ladder.
      formats:
      - chat
      - plain
      framed: true
  - name: copy
    label: trainedA
    options:
      file: data/copy/trained.jsonl
      prefix: trainedA.
      formats:
      - chat
      framed: false
  - name: copy
    label: permutedA
    options:
      file: data/copy/permuted.jsonl
      prefix: permutedA.
      formats:
      - chat
      framed: false
  - name: copy
    label: trainedB
    options:
      file: data/copy_scale/trained_B.jsonl
      prefix: trainedB.
      formats:
      - chat
      framed: false
  - name: copy
    label: permutedB
    options:
      file: data/copy_scale/permuted_B.jsonl
      prefix: permutedB.
      formats:
      - chat
      framed: false
stopping:
  max_steps: 3000
  stages:
  - 300
  - 750
  - 1500
  - 3000
