base_config: configs/tiny_v31_sft_stage11.yaml
initial_checkpoint: checkpoints/tiny_v31_sft_stage11/step-00000120
job_template: '{arm}-{seed}'
tokens_per_step: 16352
state_file: campaign.json
train:
  restore_optimizer: false
  checkpoint_alias: null
  protected_steps:
  - 120
  keep_checkpoints: 2
  eval_interval: 40
  checkpoint_interval: 40
  eval_batches: 20
  min_free_disk_gb: 20.0
optimizer:
  learning_rate: 0.0001
  warmup_steps: 12
  min_lr_ratio: 0.1
calibration_file: experiments/stage18/profile.json
resources:
  ram_margin_gib: 0.5
  disk_reserve_gib: 20.0
  disk_per_job_gib: 0.6
  disk_slack_gib: 0.5
name: context_binding
seeds:
- 1
token_budget: 2616320
output_root: experiments/context_binding
checkpoint_root: checkpoints/context_binding
arms:
  R5:
    data_dir: data/grounded/reading_bind
    mixture: &id001
      reading_en: 0.15
      reading_ru: 0.175
      reading_kk: 0.175
      chat_en: 0.05814
      chat_ru: 0.034884
      chat_kk: 0.005814
      chat_other: 0.017442
      skills: 0.116279
      dialog: 0.040698
      identity: 0.040698
      math: 0.046512
      word_math: 0.05814
      code: 0.081395
  R4:
    data_dir: data/grounded/reading_m25
    mixture: *id001
frozen_inputs:
  initial_weights: checkpoints/tiny_v31_sft_stage11/step-00000120/model.safetensors
  initial_metadata: checkpoints/tiny_v31_sft_stage11/step-00000120/meta.json
  tokenizer: data/tokenizer/tokenizer.json
  registration: docs/context_binding_registration.md
  grounded_dev: data/grounded/dev.jsonl
  context_probes_dev: data/diagnostics_dev/probes.jsonl
  block_b_en: data/grounded/reading_b/sft_groups/train.reading_en.jsonl
  block_b_ru: data/grounded/reading_b/sft_groups/train.reading_ru.jsonl
  block_b_kk: data/grounded/reading_b/sft_groups/train.reading_kk.jsonl
  block_m25_en: data/grounded/reading_m25/sft_groups/train.reading_en.jsonl
  block_m25_ru: data/grounded/reading_m25/sft_groups/train.reading_ru.jsonl
  block_m25_kk: data/grounded/reading_m25/sft_groups/train.reading_kk.jsonl
  block_bind_en: data/grounded/reading_bind/sft_groups/train.reading_en.jsonl
  block_bind_ru: data/grounded/reading_bind/sft_groups/train.reading_ru.jsonl
  block_bind_kk: data/grounded/reading_bind/sft_groups/train.reading_kk.jsonl
limits:
  active_seconds: 1500
  absolute_seconds: 7200
  max_resource_wait_seconds: 600
  max_gap_seconds: 30
evaluation:
  baseline: checkpoints/tiny_v31_sft_stage11/step-00000120
  device: mps
  tokenizer: data/tokenizer
  repetitions: 10000
  cache: experiments/evaluation_cache
  suites:
  - name: perplexity
    options:
      sets:
        v2_validation:
        - data/v2/tokens
        - validation
        - 200
  - name: grounded
    options:
      file: data/grounded/dev.jsonl
      training:
      - data/grounded/reading_b/sft_groups/train.reading_*.jsonl
      - data/grounded/reading_m25/sft_groups/train.reading_*.jsonl
      - data/grounded/reading_bind/sft_groups/train.reading_*.jsonl
  - name: probes
    options:
      file: data/diagnostics_dev/probes.jsonl
      unigram: data/v4_expanded/tokens/train.bin
reuse:
  R4-1: checkpoints/context_ablation_50/R4-1
