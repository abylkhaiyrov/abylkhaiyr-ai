name: debug_sft
model:
  vocab_size: 8192
  hidden_size: 128
  num_hidden_layers: 4
  num_attention_heads: 4
  num_key_value_heads: 2
  intermediate_size: 384
  max_position_embeddings: 256
tokenizer:
  path: data/tokenizer
train:
  stage: sft
  data_dir: data/processed
  output_dir: experiments/debug_sft
  checkpoint_dir: checkpoints/debug_sft
  init_from: checkpoints/debug
  max_steps: 200
  micro_batch_size: 16
  gradient_accumulation_steps: 1
  sequence_length: 255
  eval_interval: 50
  checkpoint_interval: 100
  optimizer: {learning_rate: 0.0005, warmup_steps: 10}
