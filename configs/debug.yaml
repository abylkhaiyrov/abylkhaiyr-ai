name: debug
model:
  vocab_size: 8192
  hidden_size: 128
  num_hidden_layers: 4
  num_attention_heads: 4
  num_key_value_heads: 2
  intermediate_size: 384
  max_position_embeddings: 256
tokenizer:
  vocab_size: 8192
  path: data/tokenizer
train:
  stage: pretrain
  data_dir: data/processed
  output_dir: experiments/debug
  checkpoint_dir: checkpoints/debug
  max_steps: 300
  micro_batch_size: 16
  gradient_accumulation_steps: 2
  sequence_length: 256
  eval_interval: 100
  checkpoint_interval: 100
  optimizer: {learning_rate: 0.002, warmup_steps: 30}
