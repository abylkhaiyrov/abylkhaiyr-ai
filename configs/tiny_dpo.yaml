name: tiny_dpo
model:
  vocab_size: 8192
  hidden_size: 384
  num_hidden_layers: 8
  num_attention_heads: 6
  num_key_value_heads: 2
  intermediate_size: 1024
  max_position_embeddings: 512
tokenizer:
  vocab_size: 8192
  path: data/tokenizer
train:
  stage: dpo
  data_dir: data/processed
  init_from: checkpoints/tiny_sft
  output_dir: experiments/tiny_dpo
  checkpoint_dir: checkpoints/tiny_dpo
  max_steps: 300
  micro_batch_size: 4
  gradient_accumulation_steps: 4
  sequence_length: 511
  eval_interval: 50
  eval_batches: 20
  log_interval: 25
  checkpoint_interval: 100
  keep_checkpoints: 3
  optimizer: {learning_rate: 0.000005, warmup_steps: 50, weight_decay: 0.1}
