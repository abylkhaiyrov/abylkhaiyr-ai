name: capacity_tiny_sft
model:
  vocab_size: 8192
  hidden_size: 384
  num_hidden_layers: 8
  num_attention_heads: 6
  num_key_value_heads: 2
  intermediate_size: 1088
  max_position_embeddings: 512
tokenizer:
  vocab_size: 8192
  path: data/tokenizer
train:
  stage: sft
  data_dir: data/v3_1
  init_from: null
  restore_optimizer: false
  output_dir: experiments/capacity_tiny_sft
  checkpoint_dir: checkpoints/capacity_tiny_sft
  device: mps
  precision: fp32
  max_steps: 120
  micro_batch_size: 8
  gradient_accumulation_steps: 4
  sequence_length: 511
  eval_interval: 40
  eval_batches: 40
  log_interval: 10
  checkpoint_interval: 40
  keep_checkpoints: 3
  protected_steps:
  - 40
  - 80
  - 120
  mixture:
    chat_en: 0.1
    chat_ru: 0.06
    chat_kk: 0.01
    chat_other: 0.03
    reading_en: 0.06
    reading_ru: 0.07
    reading_kk: 0.07
    skills: 0.2
    dialog: 0.07
    identity: 0.07
    math: 0.08
    word_math: 0.1
    code: 0.14
  dataset_version: v3.1
  optimizer:
    learning_rate: 8.0e-05
    warmup_steps: 12
    weight_decay: 0.1
    min_lr_ratio: 0.1
    max_grad_norm: 1.0
    foreach: true
  pack_sequences: true
  dynamic_batch_size: false
  sft_replay_dir: data/v2/tokens
  sft_replay_fraction: 0.03
