name: tiny_v2
model:
  vocab_size: 8192
  hidden_size: 384
  num_hidden_layers: 8
  num_attention_heads: 6
  num_key_value_heads: 2
  intermediate_size: 1024
  max_position_embeddings: 512
tokenizer:
  vocab_size: 8192
  path: data/tokenizer
train:
  stage: pretrain
  data_dir: data/v2
  init_from: checkpoints/tiny_session
  restore_optimizer: true
  output_dir: experiments/tiny_v2
  checkpoint_dir: checkpoints/tiny_v2
  device: mps
  precision: fp32
  max_steps: 6000
  micro_batch_size: 8
  gradient_accumulation_steps: 8
  sequence_length: 512
  eval_interval: 250
  eval_batches: 50
  log_interval: 25
  checkpoint_interval: 500
  keep_checkpoints: 3
  protected_steps: [1000, 2000, 4000, 6000]
  checkpoint_alias: tiny
  mixture: {ru: 1.0, kk: 1.0, en: 1.0, math: 0.5, code: 0.5}
  dataset_version: v2
  optimizer: {learning_rate: 0.0005, warmup_steps: 300, weight_decay: 0.1, min_lr_ratio: 0.1, max_grad_norm: 1.0}
