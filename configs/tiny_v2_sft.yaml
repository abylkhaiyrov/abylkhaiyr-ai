name: tiny_v2_sft
model:
  vocab_size: 8192
  hidden_size: 384
  num_hidden_layers: 8
  num_attention_heads: 6
  num_key_value_heads: 2
  intermediate_size: 1024
  max_position_embeddings: 512
tokenizer:
  vocab_size: 8192
  path: data/tokenizer
train:
  stage: sft
  data_dir: data/v2
  init_from: checkpoints/tiny_v2/tiny_best
  restore_optimizer: false
  output_dir: experiments/tiny_v2_sft
  checkpoint_dir: checkpoints/tiny_v2_sft
  device: mps
  precision: fp32
  max_steps: 1500
  micro_batch_size: 8
  gradient_accumulation_steps: 4
  sequence_length: 511
  eval_interval: 150
  eval_batches: 30
  log_interval: 25
  checkpoint_interval: 500
  keep_checkpoints: 3
  protected_steps: [500, 1000, 1500]
  checkpoint_alias: tiny_sft
  mixture: {chat: 0.5, math: 0.35, code: 0.15}
  dataset_version: v2
  optimizer: {learning_rate: 0.0002, warmup_steps: 100, weight_decay: 0.1, min_lr_ratio: 0.1, max_grad_norm: 1.0}
